<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">加载中...</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="blog.css?v=2">
</head>
<body>
    <div class="bg-dots"></div>
    <div id="bg-wallpaper"></div>

    <main class="container">
        <!-- 顶部信息栏 -->
        <div class="top-bar">
            <div class="datetime-box">
                <div class="greeting" id="greeting">你好</div>
                <div class="time" id="current-time">00:00</div>
                <div class="date" id="current-date">1月1日 星期一</div>
            </div>
            <div class="site-title-box">
                <h1 class="site-title" id="site-title">悠悠の小站</h1>
            </div>
            <div class="weather-box" id="weather-box">
                <span class="weather-icon">☀</span>
                <span class="weather-text">加载中...</span>
            </div>
        </div>

        <header class="hero-section">
            <p class="hitokoto" id="site-subtitle">加载中...</p>
        </header>

        <!-- 主要内容区 -->
        <div class="main-grid">
            <!-- 左侧：图片 + 外链 -->
            <div class="left-column">
                <div class="card gallery-card">
                    <div id="anime-img" class="api-image" onclick="openGalleryArticle()">
                        <div id="gallery-article-info" class="gallery-article-info" style="display: none;">
                            <div class="gallery-article-title" id="gallery-article-title"></div>
                            <div class="gallery-article-summary" id="gallery-article-summary"></div>
                        </div>
                    </div>
                    <div class="image-info">
                        <button class="refresh-btn" onclick="refreshImage()" title="换一张">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <polyline points="1 20 1 14 7 14"></polyline>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 外链展示 -->
                <div class="card links-card">
                    <h3 class="card-small-title">快捷链接</h3>
                    <div class="links-grid" id="links-grid">
                        <!-- 动态加载 -->
                    </div>
                </div>
            </div>

            <!-- 右侧：个人简介 -->
            <div class="right-column">
                <div class="card intro-card">
                    <div class="avatar-wrapper">
                        <div class="avatar-ring"></div>
                        <img id="qq-avatar" src="" alt="头像" class="avatar">
                        <span id="qq-nickname" class="avatar-name">-</span>
                        <span id="qq-signature" class="avatar-signature">-</span>
                    </div>
                    <div class="card-content">
                        <p id="qq-bio"><span class="bio-label">简介</span> loading...</p>
                        <div class="tag-group" id="tag-group">
                            <!-- 动态加载 -->
                        </div>
                    </div>
                </div>

                <!-- 统计信息 -->
                <div class="card stats-card">
                    <h3 class="card-small-title">本站数据</h3>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-number" id="runtime-days">0</div>
                            <div class="stat-label">运行天数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="activity-count">0</div>
                            <div class="stat-label">动态总数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-number" id="blog-count">0</div>
                            <div class="stat-label">博客文章</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 最近动态 -->
        <section class="activity-section">
            <h2 class="section-title">最近动态</h2>
            <div class="activity-list" id="activity-list">
                <!-- 动态加载 -->
            </div>
        </section>

        <!-- 博客 -->
        <section class="blog-section">
            <div class="section-header">
                <h2 class="section-title">博客</h2>
                <a href="blog.html" class="blog-more">全部文章 →</a>
            </div>
            <div class="blog-list" id="blog-list">
                <!-- 动态加载 -->
            </div>
        </section>
    </main>

    <!-- Sakana 挂件 -->
    <div id="sakana-widget-container"></div>
    <div id="sakana-widget-left"></div>

    <script src="lib/sakana.min.js"></script>
    <script src="app.js?v=2"></script>
</body>
</html>
