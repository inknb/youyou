<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="blog-page-title">博客 · 悠悠の小站</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233b82f6'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E6%82%A0%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css?v=28">
    <link rel="stylesheet" href="fonts/lxgw/lxgw-wenkai.css">
    <link rel="stylesheet" href="blog.css?v=28">
</head>
<body>
    <div class="bg-dots"></div>
    <div id="bg-wallpaper"></div>

    <main class="blog-container">
        <header class="blog-topbar" data-reveal>
            <a href="/" class="blog-back">返回首页</a>
            <span class="blog-site-name" id="blog-site-name">悠悠の小站</span>
        </header>

        <!-- 文章列表 -->
        <section id="blog-list-view" data-reveal>
            <div class="section-header">
                <h1 class="blog-list-title">全部文章</h1>
                <input type="search" id="blog-search" class="blog-search" placeholder="搜索文章..." autocomplete="off">
            </div>
            <div class="blog-list" id="blog-list">
                <div class="blog-empty">加载中...</div>
            </div>
            <button id="blog-load-more" class="blog-load-more" style="display: none;">加载更多</button>
        </section>

        <!-- 文章详情 -->
        <article id="blog-detail-view" style="display: none;" data-reveal>
            <div class="blog-detail-header">
                <h1 class="blog-detail-title" id="blog-title">-</h1>
                <div class="blog-detail-meta">
                    <span class="blog-category" id="blog-category">-</span>
                    <span class="blog-date" id="blog-date">-</span>
                    <span class="blog-reading" id="blog-reading"></span>
                </div>
            </div>
            <div class="blog-detail-content" id="blog-content"></div>
            <nav class="blog-pager" id="blog-pager" aria-label="文章导航"></nav>
            <div class="blog-detail-footer">
                <a href="blog.html" class="blog-back">返回文章列表</a>
            </div>
        </article>

        <!-- 404 -->
        <div id="blog-not-found" class="blog-empty" style="display: none;" data-reveal>文章不存在或已删除</div>

        <!-- 音乐播放器卡片（与首页共享进度） -->
        <div class="card music-player" id="music-player" style="display: none;">
            <h3 class="card-small-title">正在播放</h3>
            <div class="music-main">
                <img id="music-cover" class="music-cover" src="" alt="" title="歌单">
                <div class="music-info">
                    <div id="music-name" class="music-name">未播放</div>
                    <div id="music-artist" class="music-artist"></div>
                </div>
                <button id="music-lyric-btn" class="music-btn" title="歌词">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                </button>
                <button id="music-toggle" class="music-btn music-toggle" title="播放/暂停">
                    <svg id="music-play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="music-pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                </button>
            </div>
            <div class="music-lyric-preview" id="music-lyric-preview" title="点击查看完整歌词"></div>
            <audio id="music-audio"></audio>
            <div class="music-playlist" id="music-playlist">
                <div class="music-playlist-header">
                    <span class="music-playlist-title" id="music-playlist-name">歌单</span>
                    <span class="music-playlist-count" id="music-playlist-count"></span>
                </div>
                <ul class="music-playlist-list" id="music-playlist-list"></ul>
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="site-footer" data-reveal>
            <span id="footer-copyright"></span>
            <span class="footer-sep">·</span>
            <span id="footer-runtime"></span>
        </footer>
    </main>

    <!-- 歌词浮层 -->
    <div class="lyric-overlay" id="lyric-overlay" style="display: none;">
        <div class="lyric-panel">
            <div class="lyric-header">
                <img id="lyric-cover" class="lyric-cover" src="" alt="">
                <div class="lyric-title">
                    <div class="lyric-name" id="lyric-name">-</div>
                    <div class="lyric-artist" id="lyric-artist">-</div>
                </div>
                <button class="lyric-close" id="lyric-close" title="关闭" aria-label="关闭歌词">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="lyric-body" id="lyric-body"></div>
            <div class="lyric-controls">
                <button id="lyric-prev" class="music-btn" title="上一首">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="lyric-toggle" class="music-btn music-toggle" title="播放/暂停">
                    <svg id="lyric-play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="lyric-pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                </button>
                <button id="lyric-next" class="music-btn" title="下一首">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="lib/marked.min.js"></script>
    <script src="lib/purify.min.js"></script>
    <script src="music.js?v=28"></script>
    <script src="blog.js?v=28"></script>
</body>
</html>
